services:
  # Backend API Server
  - type: web
    name: grim-store-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm --prefix server install --include=dev && npm --prefix server run build
    startCommand: npm --prefix server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SQL_DATABASE
        value: postgres
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://client-psi-ashy.vercel.app
      - key: ADMIN_URL
        value: https://admin-lac-eight-88.vercel.app
      - key: CORS_ORIGINS
        value: https://grim-store-client.onrender.com,https://grim-store-admin.onrender.com,https://client-psi-ashy.vercel.app,https://admin-lac-eight-88.vercel.app

  # Client Storefront
  - type: web
    name: grim-store-client
    env: node
    region: oregon
    plan: free
    buildCommand: npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm --prefix client run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://grim-store-api.onrender.com/api/v1

  # Admin Dashboard
  - type: web
    name: grim-store-admin
    env: node
    region: oregon
    plan: free
    buildCommand: npm --prefix admin install --include=dev && npm --prefix admin run build
    startCommand: npm --prefix admin run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://grim-store-api.onrender.com/api/v1
